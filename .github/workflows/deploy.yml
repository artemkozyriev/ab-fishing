name: Deploy PWA to GitHub Pages

# Deploys the app/ folder (the PWA) to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5 # auto-enables Pages if needed
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app # only the PWA is published
      - id: deployment
        uses: actions/deploy-pages@v4
